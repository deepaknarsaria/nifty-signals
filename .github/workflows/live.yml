name: NIFTY live signals

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = check connections only, live = run the signal loop now"
        default: selftest
        type: choice
        options: [selftest, live]
      force:
        description: "true = run even if it already ran today"
        default: "false"
        type: string
      resume:
        description: "JSON of an open paper trade to keep tracking after a restart (optional)"
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: live-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
        run: python live_signals.py --selftest
      - name: Live signals
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          RESUME_POS: ${{ inputs.resume }}
        run: |
          if [ "$FORCE" != "true" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/runs?status=success&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.updated_at >= \"$(date -u +%F)\") | select(((.updated_at|fromdate) - (.run_started_at|fromdate)) > 600)] | length" || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "Already done today, skipping."; exit 0; fi
          fi
          python live_signals.py
      - name: Save paper trades and option chain data
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'live')
        run: |
          git config user.name "nifty-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f paper_trades.csv ]; then git add -f paper_trades.csv; fi
          if [ -d chain ]; then git add -f chain/; fi
          if [ -d barlog ]; then git add -f barlog/; fi
          git diff --cached --quiet && exit 0
          git commit -m "Live data $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase
          git push
