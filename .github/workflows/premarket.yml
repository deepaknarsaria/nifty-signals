name: NIFTY pre-market brief

on:
  schedule:
    - cron: "5 3 * * 1-5"   # 08:35 IST start; the script waits and sends at 9:01 and 9:12
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send [TEST] messages to Telegram now"
        default: test
        type: choice
        options: [test, live]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python premarket.py --send-test
      - if: github.event_name == 'schedule' || inputs.mode == 'live'
        run: python premarket.py
