name: NIFTY pre-market brief

on:
  schedule:
    # Backup only. The main start is a Claude scheduled task at 8:25 IST.
    # GitHub's timer has been running about 7 hours late on this repo, so these are spread
    # through the night. Whichever starts between 3:30 and 9:25 IST waits and sends at 9:01;
    # anything outside that window, or after the day's brief is already sent, exits at once.
    - cron: "30 19,20,22 * * *"
    - cron: "30 0,2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send [TEST] messages to Telegram now"
        default: test
        type: choice
        options: [test, live]
      force:
        description: "true = run even if it already ran today"
        default: "false"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python premarket.py --send-test
      - name: Pre-market brief
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/premarket.yml/runs?status=success&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.updated_at >= \"$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%FT%TZ)\") | select(((.updated_at|fromdate) - (.run_started_at|fromdate)) > 100)] | length" || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "Already done today, skipping."; exit 0; fi
          fi
          python premarket.py
      - name: Start the live signal run at 9:14 IST
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'live')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only on a weekday morning. live.yml has its own once-a-day guard, so an extra start is harmless.
          if [ "$(TZ=Asia/Kolkata date +%u)" -ge 6 ]; then echo "Weekend, not starting."; exit 0; fi
          t=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$t" -lt 0855 ] || [ "$t" -gt 1500 ]; then echo "Outside market hours ($t IST), not starting."; exit 0; fi
          while [ "$(date -u +%H%M%S)" -lt 034430 ]; do sleep 10; done
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/dispatches" -f ref=main -f 'inputs[mode]=live'
